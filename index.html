<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>রাব্বির 3D বুক 📖</title>

<style>
:root{
  --bg:#070914;
  --card:#111831;
  --border:#39476f;
  --text:#f5f3ff;
  --muted:#b3bdd9;
  --purple:#a855f7;
  --blue:#38bdf8;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at top left,#20285a,transparent 45%),
    radial-gradient(ellipse at bottom right,#39134d,transparent 40%),
    var(--bg);
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;
  justify-content:space-between;gap:8px;
  padding:14px;
  background:#080b18ed;
  border-bottom:1px solid #39476f;
  backdrop-filter:blur(15px);
}
.logo{font-weight:900;font-size:18px}
.logo span{color:#c084fc}
button{
  color:white;background:#171e3b;
  border:1px solid #465580;
  border-radius:11px;padding:10px 13px;
}
button:active{transform:scale(.97)}
.hero{text-align:center;padding:28px 12px 14px}
.hero h1{font-size:clamp(26px,6vw,43px);margin:12px 0}
.hero p{color:var(--muted);line-height:1.7}
.badge{
  color:#e9d5ff;background:#261644;
  border:1px solid #7548a8;border-radius:30px;
  padding:6px 12px;font-size:12px;
}
.book-area{
  width:min(950px,96%);
  margin:12px auto;perspective:1600px;
}
.book{
  display:grid;grid-template-columns:1fr 1fr;
  position:relative;transform-style:preserve-3d;
  filter:drop-shadow(0 22px 28px #0009);
}
.book:after{
  content:"";position:absolute;left:50%;top:10px;bottom:10px;
  width:9px;transform:translateX(-50%);
  background:linear-gradient(90deg,#080b18,#6874a0,#080b18);
  border-radius:5px;z-index:2;
}
.page{
  min-width:0;min-height:470px;padding:25px;
  border:1px solid var(--border);
  background:linear-gradient(145deg,#151e3c,#0b1023);
  overflow:hidden;
}
.left{border-radius:16px 3px 3px 16px}
.right{border-radius:3px 16px 16px 3px}
.page h2{font-size:clamp(22px,4vw,32px);line-height:1.3}
.page p{color:var(--muted);line-height:1.8}
.kicker{font-size:12px;color:var(--blue);font-weight:800}
.big-icon{font-size:48px;margin-top:18px}
.glow{
  background:linear-gradient(90deg,#38bdf8,#c084fc,#f0abfc);
  color:transparent;background-clip:text;
}
.grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;margin-top:18px;
}
.tile{
  min-width:0;padding:13px;border:1px solid #39476f;
  background:#121b34;border-radius:13px;
}
.tile b{display:block;margin:5px 0}
.tile small{color:var(--muted);line-height:1.6}
.tile .emoji{font-size:23px}
.field{
  width:100%;padding:11px;margin:6px 0;
  color:white;background:#080e20;
  border:1px solid #465580;border-radius:10px;
}
textarea.field{min-height:90px;resize:vertical}
.action{
  background:linear-gradient(110deg,#2563eb,#9333ea);
  border:0;font-weight:bold;margin-top:7px;
}
.result{
  margin-top:10px;padding:12px;
  background:#080e20;border:1px dashed #465580;
  border-radius:10px;white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.controls{
  display:flex;justify-content:center;align-items:center;
  flex-wrap:wrap;gap:12px;padding:16px 8px;
}
.nav{min-width:110px;font-weight:bold}
.next{background:linear-gradient(110deg,#2563eb,#9333ea);border:0}
#pageCount{font-size:13px;color:#d8b4fe}
.dots{display:flex;justify-content:center;gap:7px;padding:4px 10px 22px}
.dot{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:#414d70}
.dot.active{background:#c084fc;box-shadow:0 0 12px #c084fc}
footer{text-align:center;color:#8995b8;font-size:12px;padding:20px}
a{color:#93c5fd;overflow-wrap:anywhere}
.anim{animation:flip .4s ease}
@keyframes flip{
  from{opacity:.3;transform:rotateY(-8deg) translateX(8px)}
  to{opacity:1;transform:rotateY(0) translateX(0)}
}
body.light{
  --bg:#e9edff;--text:#15182e;--muted:#4b5673;
}
body.light header{background:#e9edffed}
body.light .page{background:linear-gradient(145deg,#f8f9ff,#dfe7ff)}
body.light .tile{background:#edf0ff}
body.light .field,body.light .result{background:white;color:#15182e}
body.light button{color:#15182e}
@media(max-width:600px){
  .hero{padding-top:22px}
  .book{grid-template-columns:1fr;gap:6px}
  .book:after{display:none}
  .page{min-height:320px;padding:20px}
  .left,.right{border-radius:14px}
  .logo{font-size:15px}
  header{padding:11px}
  .grid{gap:8px}
}
@media(prefers-reduced-motion:reduce){
  .anim{animation:none}
}
</style>
</head>

<body>
<header>
  <div class="logo">📖 রাব্বির <span>3D বুক</span></div>
  <div>
    <button onclick="toggleTheme()">🌗 থিম</button>
  </div>
</header>

<section class="hero">
  <span class="badge">✦ MY DIGITAL WORLD ✦</span>
  <h1>একটি বই, <span class="glow">অসংখ্য সম্ভাবনা</span></h1>
  <p>পৃষ্ঠা উল্টাও, নতুন কিছু আবিষ্কার করো। 💜</p>
</section>

<main class="book-area">
  <div class="book">
    <article class="page left anim" id="leftPage"></article>
    <article class="page right anim" id="rightPage"></article>
  </div>
</main>

<div class="controls">
  <button class="nav" id="prevBtn" onclick="previousPage()">← Previous</button>
  <span id="pageCount">পৃষ্ঠা ১–২</span>
  <button class="nav next" id="nextBtn" onclick="nextPage()">Next →</button>
</div>
<div class="dots" id="dots"></div>

<footer>Made with 💜 by Rabbi · রাব্বির 3D বুক</footer>

<script>
const pages = [
{
 title:"স্বাগতম আমার 3D বুক-এ!",
 icon:"📖",
 desc:"এটি তোমার নিজের ডিজিটাল জগৎ। প্রতিটি পৃষ্ঠায় আছে নতুন ফিচার। Next চাপো এবং বইটি ঘুরে দেখো।",
 cards:[
  ["🌌","আমার জগৎ","ডার্ক 3D ডিজাইন"],
  ["✨","নতুন অভিজ্ঞতা","প্রতিটি পৃষ্ঠায় নতুন কিছু"]
 ]
},
{
 title:"Home Dashboard",
 icon:"🚀",
 desc:"সব প্রয়োজনীয় ফিচার এক জায়গায়।",
 cards:[
  ["🧰","Smart Tools","ক্যালকুলেটর ও নোট"],
  ["🖼️","Gallery","ছবি ও আইডিয়া"],
  ["🎵","Music","নিজের অডিও চালাও"],
  ["🎮","Games","ছোট গেম খেলো"]
 ]
},
{
 title:"আমার পরিচয়",
 icon:"👤",
 desc:"নিজের নাম ও পরিচিতি লিখে রাখো।",
 type:"profile"
},
{
 title:"Smart Calculator",
 icon:"🧮",
 desc:"সহজেই যোগ, বিয়োগ, গুণ ও ভাগ করো।",
 type:"calculator"
},
{
 title:"My Notes",
 icon:"📝",
 desc:"তোমার গুরুত্বপূর্ণ লেখা সেভ করে রাখো।",
 type:"notes"
},
{
 title:"Gallery & Ideas",
 icon:"🖼️",
 desc:"নিজের পছন্দের ছবি বা ওয়েব লিংক যোগ করো।",
 type:"gallery"
},
{
 title:"Music Zone",
 icon:"🎵",
 desc:"ফোনের অডিও ফাইল বেছে নিয়ে চালাও।",
 type:"music"
},
{
 title:"Mini Games",
 icon:"🎮",
 desc:"১ থেকে ১০-এর মধ্যে সঠিক সংখ্যা ধরো।",
 type:"game"
},
{
 title:"AI Zone",
 icon:"🤖",
 desc:"জনপ্রিয় AI সেবাগুলো দ্রুত খুলে নাও।",
 cards:[
  ["✨","ChatGPT","AI সহকারী","https://chatgpt.com/"],
  ["🎨","Canva","ডিজাইন তৈরি","https://www.canva.com/"],
  ["🎬","CapCut","ভিডিও এডিটিং","https://www.capcut.com/"],
  ["▶️","YouTube","ভিডিও প্ল্যাটফর্ম","https://www.youtube.com/"]
 ]
},
{
 title:"Contact & Settings",
 icon:"💌",
 desc:"নিজের যোগাযোগের তথ্য লিখে রাখো।",
 type:"contact"
}
];

let current=0;
let secret=Math.floor(Math.random()*10)+1;

const left=document.getElementById("leftPage");
const right=document.getElementById("rightPage");

function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 }[c]));
}

function cardsHTML(cards){
 return '<div class="grid">'+cards.map(c=>
 `<div class="tile">
 <div class="emoji">${c[0]}</div>
 <b>${esc(c[1])}</b>
 <small>${esc(c[2]||"নতুন ফিচার")}</small>
 ${c[3]?`<p><a href="${esc(c[3])}" target="_blank" rel="noopener">খুলুন ↗</a></p>`:""}
 </div>`
 ).join("")+"</div>";
}

function content(p){
 let html=`<div class="kicker">RABBI'S 3D BOOK</div>
 <div class="big-icon">${p.icon}</div>
 <h2>${p.title}</h2><p>${p.desc}</p>`;

 if(p.cards) return html+cardsHTML(p.cards);

 if(p.type==="profile") html+=`
 <div class="tile">
 <input class="field" id="pName" placeholder="তোমার নাম">
 <textarea class="field" id="pBio" placeholder="নিজের পরিচিতি"></textarea>
 <button class="action" onclick="saveProfile()">প্রোফাইল সেভ</button>
 <div class="result" id="pResult"></div>
 </div>`;

 if(p.type==="calculator") html+=`
 <div class="tile">
 <input class="field" type="number" id="num1" placeholder="প্রথম সংখ্যা">
 <select class="field" id="operator">
 <option value="+">যোগ (+)</option>
 <option value="-">বিয়োগ (-)</option>
 <option value="*">গুণ (×)</option>
 <option value="/">ভাগ (÷)</option>
 </select>
 <input class="field" type="number" id="num2" placeholder="দ্বিতীয় সংখ্যা">
 <button class="action" onclick="calculate()">হিসাব করো</button>
 <div class="result" id="calcResult">ফলাফল এখানে আসবে</div>
 </div>`;

 if(p.type==="notes") html+=`
 <textarea class="field" id="noteText" placeholder="তোমার নোট লেখো..."></textarea>
 <button class="action" onclick="saveNote()">💾 নোট সেভ</button>
 <button onclick="clearNote()">মুছুন</button>
 <div class="result" id="noteResult"></div>`;

 if(p.type==="gallery") html+=`
 <div class="tile">
 <input class="field" id="gTitle" placeholder="ছবি বা আইডিয়ার নাম">
 <input class="field" id="gUrl" placeholder="https://example.com">
 <button class="action" onclick="addGallery()">লিংক যোগ করো</button>
 <div id="galleryResult"></div>
 </div>`;

 if(p.type==="music") html+=`
 <div class="tile">
 <input class="field" id="audioFile" type="file" accept="audio/*">
 <audio id="audioPlayer" controls style="width:100%;margin-top:12px"></audio>
 <p><small>অডিও ফাইল সার্ভারে আপলোড হয় না।</small></p>
 </div>`;

 if(p.type==="game") html+=`
 <div class="tile">
 <input class="field" id="guess" type="number" min="1" max="10" placeholder="১ থেকে ১০">
 <button class="action" onclick="checkGuess()">উত্তর দাও</button>
 <button onclick="resetGame()">নতুন খেলা</button>
 <div class="result" id="gameResult">চেষ্টা করো! 😄</div>
 </div>`;

 if(p.type==="contact") html+=`
 <div class="tile">
 <input class="field" id="cName" placeholder="তোমার নাম">
 <input class="field" id="cInfo" placeholder="ইমেইল বা সোশ্যাল লিংক">
 <textarea class="field" id="cMsg" placeholder="ছোট্ট বার্তা"></textarea>
 <button class="action" onclick="saveContact()">তথ্য সেভ</button>
 <div class="result" id="cResult">তথ্য এই ডিভাইসে সেভ হবে।</div>
 </div>`;

 return html;
}

function render(){
 const p1=pages[current];
 const p2=pages[current+1];

 left.innerHTML=content(p1);
 right.innerHTML=p2?content(p2):
 `<div class="kicker">THE END</div>
 <div class="big-icon">💜</div>
 <h2>ধন্যবাদ!</h2>
 <p>রাব্বির 3D বুক ঘুরে দেখার জন্য ধন্যবাদ।</p>
 <div class="tile"><b>✨ আরও ফিচার আসছে</b>
 <small>ভবিষ্যতে আরও টুল যোগ করা যাবে।</small></div>`;

 left.classList.remove("anim");
 right.classList.remove("anim");
 void left.offsetWidth;
 left.classList.add("anim");
 right.classList.add("anim");

 document.getElementById("pageCount").textContent=
 `পৃষ্ঠা ${current+1}–${Math.min(current+2,pages.length)} / ${pages.length}`;

 document.getElementById("prevBtn").disabled=current===0;
 document.getElementById("prevBtn").style.opacity=current===0?".4":"1";
 document.getElementById("nextBtn").textContent=
 current>=pages.length-2?"শেষ পৃষ্ঠা ✓":"Next →";

 document.getElementById("dots").innerHTML=pages.map((p,i)=>
 `<button class="dot ${i===current?"active":""}"
 onclick="goTo(${i})" aria-label="পৃষ্ঠা ${i+1}"></button>`
 ).join("");

 loadPageData(p1.type);
 if(p2) loadPageData(p2.type);
}

function nextPage(){
 if(current<pages.length-1){current=Math.min(current+2,pages.length-1);render()}
}
function previousPage(){
 if(current>0){current=Math.max(0,current-2);render()}
}
function goTo(i){current=i;render()}
function toggleTheme(){document.body.classList.toggle("light")}

function save(key,value){
 try{localStorage.setItem("rabbibook_"+key,value)}
 catch(e){alert("এই ব্রাউজারে সেভ করা যাচ্ছে না।")}
}
function read(key){
 try{return localStorage.getItem("rabbibook_"+key)||""}
 catch(e){return ""}
}

function saveProfile(){
 save("name",document.getElementById("pName").value);
 save("bio",document.getElementById("pBio").value);
 loadProfile();alert("প্রোফাইল সেভ হয়েছে!");
}
function loadProfile(){
 const n=document.getElementById("pName");
 const b=document.getElementById("pBio");
 const r=document.getElementById("pResult");
 if(n)n.value=read("name");
 if(b)b.value=read("bio");
 if(r)r.textContent=(read("name")||"তোমার নাম")+" — "+(read("bio")||"পরিচিতি লেখা হয়নি");
}

function calculate(){
 const a=Number(document.getElementById("num1").value);
 const b=Number(document.getElementById("num2").value);
 const op=document.getElementById("operator").value;
 let result;
 if(op==="+")result=a+b;
 if(op==="-")result=a-b;
 if(op==="*")result=a*b;
 if(op==="/")result=b===0?"শূন্য দিয়ে ভাগ করা যায় না":a/b;
 document.getElementById("calcResult").textContent="ফলাফল: "+result;
}

function saveNote(){
 save("note",document.getElementById("noteText").value);
 loadNote();alert("নোট সেভ হয়েছে!");
}
function loadNote(){
 const n=document.getElementById("noteText");
 const r=document.getElementById("noteResult");
 if(n)n.value=read("note");
 if(r)r.textContent=read("note")||"এখনও কোনো নোট নেই।";
}
function clearNote(){save("note","");loadNote()}

function loadGallery(){
 const el=document.getElementById("galleryResult");
 if(!el)return;
 let arr=[];
 try{arr=JSON.parse(read("gallery")||"[]")}catch(e){}
 el.innerHTML=arr.map(x=>
 `<div class="tile" style="margin-top:8px">
 <b>${esc(x.title)}</b><p><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a></p>
 </div>`).join("")||"<p>এখনও কোনো লিংক নেই।</p>";
}
function addGallery(){
 const title=document.getElementById("gTitle").value.trim();
 const url=document.getElementById("gUrl").value.trim();
 if(!title||!/^https?:\/\//i.test(url)){
 alert("নাম এবং সঠিক https:// লিংক দাও");return;
 }
 let arr=[];
 try{arr=JSON.parse(read("gallery")||"[]")}catch(e){}
 arr.unshift({title,url});
 save("gallery",JSON.stringify(arr.slice(0,30)));
 loadGallery();
}

document.addEventListener("change",function(e){
 if(e.target.id==="audioFile"){
  const f=e.target.files[0];
  if(f)document.getElementById("audioPlayer").src=URL.createObjectURL(f);
 }
});

function checkGuess(){
 const v=Number(document.getElementById("guess").value);
 const r=document.getElementById("gameResult");
 if(v<1||v>10){r.textContent="১ থেকে ১০-এর মধ্যে সংখ্যা দাও";return}
 r.textContent=v===secret?"🎉 ঠিক ধরেছ! দারুণ!":"মেলেনি! আবার চেষ্টা করো।";
}
function resetGame(){
 secret=Math.floor(Math.random()*10)+1;
 document.getElementById("guess").value="";
 document.getElementById("gameResult").textContent="নতুন সংখ্যা বেছে নাও!";
}

function saveContact(){
 const data={
  name:document.getElementById("cName").value,
  info:document.getElementById("cInfo").value,
  msg:document.getElementById("cMsg").value
 };
 save("contact",JSON.stringify(data));
 loadContact();alert("তথ্য সেভ হয়েছে!");
}
function loadContact(){
 let d={};
 try{d=JSON.parse(read("contact")||"{}")}catch(e){}
 const n=document.getElementById("cName");
 const i=document.getElementById("cInfo");
 const m=document.getElementById("cMsg");
 const r=document.getElementById("cResult");
 if(n)n.value=d.name||"";
 if(i)i.value=d.info||"";
 if(m)m.value=d.msg||"";
 if(r)r.textContent=d.name?"সেভ করা নাম: "+d.name:"তথ্য এই ডিভাইসে সেভ হবে।";
}

function loadPageData(type){
 if(type==="profile")loadProfile();
 if(type==="notes")loadNote();
 if(type==="gallery")loadGallery();
 if(type==="contact")loadContact();
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowRight")nextPage();
 if(e.key==="ArrowLeft")previousPage();
});

let startX=0;
document.querySelector(".book").addEventListener("touchstart",e=>{
 startX=e.changedTouches[0].screenX;
},{passive:true});
document.querySelector(".book").addEventListener("touchend",e=>{
 const dx=e.changedTouches[0].screenX-startX;
 if(Math.abs(dx)>65){dx<0?nextPage():previousPage()}
},{passive:true});

render();
</script>
</body>
  </html>
