<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>রাব্বির 3D বুক 📖</title>

<style>
:root {
  --bg:#070914;
  --text:#f5f3ff;
  --muted:#b3bdd9;
  --line:#39476f;
  --purple:#a855f7;
  --blue:#38bdf8;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  font-family:system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at top left,#20285a,transparent 45%),
    radial-gradient(ellipse at bottom right,#39134d,transparent 40%),
    var(--bg);
}
button,input,textarea,select{font:inherit}
button{
  cursor:pointer;color:white;
  background:#171e3b;
  border:1px solid #465580;
  border-radius:11px;padding:10px 13px;
}
button:active{transform:scale(.97)}
header{
  position:sticky;top:0;z-index:10;
  display:flex;justify-content:space-between;
  align-items:center;gap:8px;padding:13px;
  background:#080b18ed;
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);
}
.logo{font-weight:900;font-size:18px}
.logo span{color:#c084fc}
.hero{text-align:center;padding:26px 12px 14px}
.hero h1{font-size:clamp(25px,5vw,42px);margin:12px 0}
.hero p{color:var(--muted);line-height:1.7}
.badge{
  display:inline-block;color:#e9d5ff;
  background:#261644;border:1px solid #7548a8;
  border-radius:30px;padding:6px 12px;font-size:12px;
}
.area{width:min(980px,96%);margin:20px auto;perspective:2200px}
.book{
  position:relative;display:grid;
  grid-template-columns:1fr 1fr;min-height:470px;
  transform-style:preserve-3d;
  filter:drop-shadow(0 24px 28px #0009);
}
.page{
  position:relative;min-width:0;min-height:470px;
  padding:clamp(18px,3vw,30px);overflow:hidden;
  border:1px solid var(--line);
  background:linear-gradient(135deg,#172344,#0b1023 80%);
  backface-visibility:hidden;
}
.left{border-radius:16px 2px 2px 16px;box-shadow:inset -15px 0 22px #02061155}
.right{border-radius:2px 16px 16px 2px;box-shadow:inset 15px 0 22px #02061155}
.spine{
  position:absolute;z-index:4;left:50%;top:4px;bottom:4px;
  width:10px;transform:translateX(-50%);
  background:linear-gradient(90deg,#030611,#6874a0,#080b18);
  border-radius:5px;pointer-events:none;
}
.sheet{
  position:absolute;z-index:5;top:0;bottom:0;
  width:50%;transform-style:preserve-3d;display:none;
}
.sheet.next{left:50%;transform-origin:left center}
.sheet.prev{left:0;transform-origin:right center}
.face{
  position:absolute;inset:0;padding:clamp(18px,3vw,30px);
  overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(135deg,#172344,#0b1023 80%);
  backface-visibility:hidden;
}
.face.front{border-radius:2px 16px 16px 2px}
.face.back{transform:rotateY(180deg);border-radius:16px 2px 2px 16px}
.sheet.prev .front{border-radius:16px 2px 2px 16px}
.sheet.prev .back{border-radius:2px 16px 16px 2px}
.sheet.go-next{display:block;animation:flipNext .8s ease-in-out forwards}
.sheet.go-prev{display:block;animation:flipPrev .8s ease-in-out forwards}
@keyframes flipNext{
  0%{transform:rotateY(0)}
  45%{filter:brightness(.75)}
  100%{transform:rotateY(-180deg)}
}
@keyframes flipPrev{
  0%{transform:rotateY(0)}
  45%{filter:brightness(.75)}
  100%{transform:rotateY(180deg)}
}
.kicker{font-size:11px;letter-spacing:1.4px;color:var(--blue);font-weight:800}
.page h2,.face h2{font-size:clamp(22px,3.6vw,31px);line-height:1.3}
.page p,.face p{color:var(--muted);line-height:1.75}
.big{font-size:44px;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:16px}
.tile{padding:12px;border:1px solid var(--line);background:#121b34;border-radius:13px;min-width:0}
.tile b{display:block;margin:5px 0}
.tile small{color:var(--muted);line-height:1.5}
.field{
  width:100%;padding:10px;margin:5px 0;color:white;
  background:#080e20;border:1px solid #465580;border-radius:10px;
}
textarea.field{min-height:75px;resize:vertical}
.action{background:linear-gradient(110deg,#2563eb,#9333ea);border:0;margin-top:7px}
.result{
  margin-top:9px;padding:10px;background:#080e20;
  border:1px dashed #465580;border-radius:10px;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 8px}
.nav{min-width:110px;font-weight:bold}
.nextbtn{background:linear-gradient(110deg,#2563eb,#9333ea);border:0}
#count{color:#d8b4fe;font-size:13px}
.dots{display:flex;justify-content:center;gap:7px;padding:4px 10px 20px}
.dot{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:#414d70}
.dot.active{background:#c084fc;box-shadow:0 0 12px #c084fc}
footer{text-align:center;color:#8995b8;font-size:12px;padding:18px}
a{color:#93c5fd;overflow-wrap:anywhere}
body.light{--bg:#e9edff;--text:#15182e;--muted:#4b5673}
body.light header{background:#e9edffed}
body.light .page,body.light .face{background:linear-gradient(135deg,#f8f9ff,#dfe7ff)}
body.light .tile{background:#edf0ff}
body.light .field,body.light .result{background:white;color:#15182e}
body.light button{color:#15182e}
@media(max-width:620px){
  .area{width:96%}
  .book{grid-template-columns:1fr;gap:7px;min-height:0}
  .page{min-height:330px;padding:19px}
  .left,.right{border-radius:14px}
  .spine,.sheet{display:none!important}
  .grid{gap:7px}.tile{padding:10px}
  .logo{font-size:16px}
}
@media(prefers-reduced-motion:reduce){
  .sheet.go-next,.sheet.go-prev{animation-duration:.01ms}
}
</style>
</head>

<body>
<header>
  <div class="logo">📖 রাব্বির <span>3D বুক</span></div>
  <button onclick="document.body.classList.toggle('light')">🌗 থিম</button>
</header>

<section class="hero">
  <span class="badge">✦ MY DIGITAL WORLD ✦</span>
  <h1>একটি বই, <span style="color:#c084fc">অসংখ্য সম্ভাবনা</span></h1>
  <p>Next চাপো অথবা মোবাইলে সোয়াইপ করো। 💜</p>
</section>

<main class="area">
  <div class="book" id="book">
    <article class="page left" id="left"></article>
    <article class="page right" id="right"></article>
    <div class="spine"></div>
    <div class="sheet next" id="sheet">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </div>
  </div>
</main>

<div class="controls">
  <button class="nav" id="prev">← Previous</button>
  <span id="count"></span>
  <button class="nav nextbtn" id="next">Next →</button>
</div>
<div class="dots" id="dots"></div>
<footer>Made with 💜 by Rabbi · রাব্বির 3D বুক</footer>

<script>
const P=[
{t:"স্বাগতম আমার 3D বুক-এ!",i:"📖",d:"এটি তোমার নিজের ডিজিটাল জগৎ। প্রতিটি পৃষ্ঠায় আছে নতুন ফিচার। Next চাপো এবং বইটি ঘুরে দেখো।",c:[["🌌","আমার জগৎ","ডার্ক 3D ডিজাইন"],["✨","নতুন অভিজ্ঞতা","প্রতি পৃষ্ঠায় নতুন কিছু"]]},
{t:"Home Dashboard",i:"🚀",d:"সব প্রয়োজনীয় ফিচার এক জায়গায়।",c:[["🧰","Smart Tools","ক্যালকুলেটর ও নোট"],["🖼️","Gallery","ছবি ও আইডিয়া"],["🎵","Music","নিজের অডিও চালাও"],["🎮","Games","ছোট গেম"]]},
{t:"আমার পরিচয়",i:"👤",d:"নিজের নাম ও পরিচিতি সেভ করো।",type:"profile"},
{t:"Smart Calculator",i:"🧮",d:"যোগ, বিয়োগ, গুণ ও ভাগ করো।",type:"calc"},
{t:"My Notes",i:"📝",d:"গুরুত্বপূর্ণ নোট এই ব্রাউজারে সেভ করো।",type:"notes"},
{t:"Gallery & Ideas",i:"🖼️",d:"ছবি বা আইডিয়ার ওয়েব লিংক যোগ করো।",type:"gallery"},
{t:"Music Zone",i:"🎵",d:"ফোনের অডিও ফাইল বেছে নিয়ে চালাও।",type:"music"},
{t:"Mini Games",i:"🎮",d:"১ থেকে ১০-এর মধ্যে সঠিক সংখ্যা ধরো।",type:"game"},
{t:"AI Zone",i:"🤖",d:"জনপ্রিয় AI সেবার শর্টকাট।",c:[["✨","ChatGPT","AI সহকারী","https://chatgpt.com/"],["🎨","Canva","ডিজাইন","https://www.canva.com/"],["🎬","CapCut","ভিডিও এডিট","https://www.capcut.com/"],["▶️","YouTube","ভিডিও","https://www.youtube.com/"]]},
{t:"Contact & Settings",i:"💌",d:"নিজের যোগাযোগের তথ্য সেভ করো।",type:"contact"}
];

let idx=0,busy=false,secret=1+Math.floor(Math.random()*10);
const L=document.getElementById("left"),R=document.getElementById("right");
const S=document.getElementById("sheet"),F=document.getElementById("front");
const B=document.getElementById("back"),book=document.getElementById("book");

function esc(s){
 return String(s??"").replace(/[&<>"']/g,x=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[x]));
}

function inner(p,n){
 if(!p)return '<div class="kicker">THE END</div><div class="big">💜</div><h2>ধন্যবাদ!</h2><p>রাব্বির 3D বুক ঘুরে দেখার জন্য ধন্যবাদ।</p>';
 let h=`<div class="kicker">RABBI'S 3D BOOK · ${String(n+1).padStart(2,"0")}</div><div class="big">${p.i}</div><h2>${p.t}</h2><p>${p.d}</p>`;

 if(p.c)h+='<div class="grid">'+p.c.map(x=>
 `<div class="tile"><div>${x[0]}</div><b>${esc(x[1])}</b><small>${esc(x[2])}</small>${x[3]?`<p><a target="_blank" rel="noopener" href="${esc(x[3])}">খুলুন ↗</a></p>`:""}</div>`
 ).join("")+'</div>';

 if(p.type==="profile")h+='<div class="tile"><input class="field" id="pn" placeholder="তোমার নাম"><textarea class="field" id="pb" placeholder="নিজের পরিচিতি"></textarea><button class="action" onclick="saveProfile()">প্রোফাইল সেভ</button><div class="result" id="pr"></div></div>';

 if(p.type==="calc")h+='<div class="tile"><input class="field" id="a" type="number" placeholder="প্রথম সংখ্যা"><select class="field" id="op"><option value="+">যোগ (+)</option><option value="-">বিয়োগ (-)</option><option value="*">গুণ (×)</option><option value="/">ভাগ (÷)</option></select><input class="field" id="b" type="number" placeholder="দ্বিতীয় সংখ্যা"><button class="action" onclick="calc()">হিসাব করো</button><div class="result" id="cr">ফলাফল এখানে আসবে</div></div>';

 if(p.type==="notes")h+='<textarea class="field" id="nt" placeholder="তোমার নোট লেখো"></textarea><button class="action" onclick="saveNote()">নোট সেভ</button> <button onclick="clearNote()">মুছুন</button><div class="result" id="nr"></div>';

 if(p.type==="gallery")h+='<div class="tile"><input class="field" id="gt" placeholder="লিংকের নাম"><input class="field" id="gu" placeholder="https://..."><button class="action" onclick="addGallery()">লিংক যোগ করো</button><div id="gr"></div></div>';

 if(p.type==="music")h+='<div class="tile"><input class="field" id="af" type="file" accept="audio/*"><audio id="ap" controls style="width:100%;margin-top:12px"></audio><p><small>অডিও সার্ভারে আপলোড হয় না।</small></p></div>';

 if(p.type==="game")h+='<div class="tile"><input class="field" id="guess" type="number" min="1" max="10" placeholder="১–১০"><button class="action" onclick="checkGame()">উত্তর দাও</button> <button onclick="newGame()">নতুন খেলা</button><div class="result" id="gameResult">চেষ্টা করো!</div></div>';

 if(p.type==="contact")h+='<div class="tile"><input class="field" id="cn" placeholder="তোমার নাম"><input class="field" id="ci" placeholder="ইমেইল বা সোশ্যাল লিংক"><textarea class="field" id="cm" placeholder="বার্তা"></textarea><button class="action" onclick="saveContact()">তথ্য সেভ</button><div class="result" id="conr">তথ্য এই ডিভাইসে সেভ হবে</div></div>';

 return h;
}

function render(){
 L.innerHTML=inner(P[idx],idx);
 R.innerHTML=inner(P[idx+1],idx+1);
 document.getElementById("count").textContent=`পৃষ্ঠা ${idx+1}–${Math.min(idx+2,P.length)} / ${P.length}`;
 document.getElementById("prev").disabled=idx===0;
 document.getElementById("prev").style.opacity=idx===0?".4":"1";
 document.getElementById("next").textContent=idx>=P.length-2?"শেষ পৃষ্ঠা ✓":"Next →";
 document.getElementById("dots").innerHTML=P.map((p,i)=>`<button class="dot ${i===idx?"active":""}" onclick="go(${i})" aria-label="পৃষ্ঠা ${i+1}"></button>`).join("");
 load(P[idx]?.type);load(P[idx+1]?.type);
}

function turn(dir){
 if(busy)return;
 let target=dir==="next"?Math.min(idx+2,P.length-1):Math.max(idx-2,0);
 if(target===idx)return;
 if(matchMedia("(max-width:620px)").matches){idx=target;render();return}
 busy=true;book.style.pointerEvents="none";
 S.className="sheet "+(dir==="next"?"next":"prev");
 F.innerHTML=inner(P[dir==="next"?idx+1:idx],dir==="next"?idx+1:idx);
 B.innerHTML=inner(P[target],target);
 S.style.display="block";void S.offsetWidth;
 S.classList.add(dir==="next"?"go-next":"go-prev");
 setTimeout(()=>{
  idx=target;S.className="sheet next";S.style.display="none";
  book.style.pointerEvents="";busy=false;render();
 },820);
}
function go(i){if(busy)return;idx=i;render()}
document.getElementById("next").onclick=()=>turn("next");
document.getElementById("prev").onclick=()=>turn("prev");

function get(k){try{return localStorage.getItem("rb_"+k)||""}catch(e){return""}}
function put(k,v){try{localStorage.setItem("rb_"+k,v)}catch(e){alert("এই ব্রাউজারে সেভ করা যাচ্ছে না")}}

function saveProfile(){
 put("name",document.getElementById("pn").value);
 put("bio",document.getElementById("pb").value);
 load("profile");
}
function calc(){
 let a=Number(document.getElementById("a").value);
 let b=Number(document.getElementById("b").value);
 let o=document.getElementById("op").value;
 let r=o==="+"?a+b:o==="-"?a-b:o==="*"?a*b:b===0?"শূন্য দিয়ে ভাগ করা যায় না":a/b;
 document.getElementById("cr").textContent="ফলাফল: "+r;
}
function saveNote(){put("note",document.getElementById("nt").value);load("notes")}
function clearNote(){put("note","");load("notes")}

function addGallery(){
 let t=document.getElementById("gt").value.trim();
 let u=document.getElementById("gu").value.trim();
 if(!t||!/^https?:\/\//i.test(u)){alert("নাম ও http/https লিংক দাও");return}
 let a=[];try{a=JSON.parse(get("gallery")||"[]")}catch(e){}
 a.unshift({t,u});put("gallery",JSON.stringify(a.slice(0,30)));load("gallery");
}

function load(type){
 if(type==="profile"){
  let n=document.getElementById("pn"),b=document.getElementById("pb"),r=document.getElementById("pr");
  if(n)n.value=get("name");if(b)b.value=get("bio");
  if(r)r.textContent=(get("name")||"তোমার নাম")+" — "+(get("bio")||"পরিচিতি লেখা হয়নি");
 }
 if(type==="notes"){
  let n=document.getElementById("nt"),r=document.getElementById("nr");
  if(n)n.value=get("note");if(r)r.textContent=get("note")||"এখনও কোনো নোট নেই";
 }
 if(type==="gallery"){
  let r=document.getElementById("gr");
  if(r){let a=[];try{a=JSON.parse(get("gallery")||"[]")}catch(e){}
   r.innerHTML=a.map(x=>`<div class="tile"><b>${esc(x.t)}</b><p><a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.u)}</a></p></div>`).join("")||"<p>এখনও কোনো লিংক নেই।</p>";
  }
 }
 if(type==="contact"){
  let d={};try{d=JSON.parse(get("contact")||"{}")}catch(e){}
  let n=document.getElementById("cn"),i=document.getElementById("ci"),m=document.getElementById("cm"),r=document.getElementById("conr");
  if(n)n.value=d.n||"";if(i)i.value=d.i||"";if(m)m.value=d.m||"";
  if(r)r.textContent=d.n?"সেভ করা নাম: "+d.n:"তথ্য এই ডিভাইসে সেভ হবে";
 }
}

function saveContact(){
 put("contact",JSON.stringify({
  n:document.getElementById("cn").value,
  i:document.getElementById("ci").value,
  m:document.getElementById("cm").value
 }));
 load("contact");
}

document.addEventListener("change",e=>{
 if(e.target.id==="af"&&e.target.files[0])
  document.getElementById("ap").src=URL.createObjectURL(e.target.files[0]);
});

function checkGame(){
 let v=Number(document.getElementById("guess").value);
 document.getElementById("gameResult").textContent=
 v===secret?"🎉 ঠিক ধরেছ!":v<1||v>10?"১–১০ এর সংখ্যা দাও":"মেলেনি, আবার চেষ্টা করো";
}
function newGame(){
 secret=1+Math.floor(Math.random()*10);
 document.getElementById("guess").value="";
 document.getElementById("gameResult").textContent="নতুন সংখ্যা বেছে নাও";
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowRight")turn("next");
 if(e.key==="ArrowLeft")turn("prev");
});
let sx=0;
book.addEventListener("touchstart",e=>sx=e.changedTouches[0].screenX,{passive:true});
book.addEventListener("touchend",e=>{
 let dx=e.changedTouches[0].screenX-sx;
 if(Math.abs(dx)>65)turn(dx<0?"next":"prev");
},{passive:true});

render();
</script>
</body>
</html>
